name: Adaptive Engine Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/adaptive-win6-drift]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
